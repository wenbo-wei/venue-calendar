name: Refresh and deploy Venue Calendar

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install refresh dependencies
        run: python -m pip install -r requirements.txt
      - name: Check official data parsers
        run: python -m unittest discover -s tests -v
      - name: Refresh from official conference websites
        run: python scripts/refresh_official.py
      - name: Summarize refreshed data
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          state = json.loads(Path("data/refresh_state.json").read_text())
          print(f"Official sites checked: {state['checked_at']}")
          print("\n| Conference | Official page | Deadlines | Location |")
          print("| --- | --- | --- | --- |")
          for slug, venue in state["venues"].items():
              dates = ", ".join(f"{key}: {value}" for key, value in venue.get("deadlines", {}).items()) or "Not verified"
              if venue.get("deadlines"):
                  dates += f" ({venue.get('timezone', 'UTC-12')})"
              location = (venue.get("location") or {}).get("display", "Not verified")
              cells = [slug, venue["status"], dates, location]
              print("| " + " | ".join(str(cell).replace("|", "\\|").replace("\n", " ") for cell in cells) + " |")
          PY
      - name: Save refreshed data
        run: |
          if ! git diff --quiet -- data/conferences.js data/refresh_state.json; then
            git config user.name "venue-calendar-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/conferences.js data/refresh_state.json
            git commit -m "Update official conference snapshot"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
